x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "2"

services:
  portal:
    profiles: ["portal"]
    build:
      context: ./portal
      target: runtime
    image: kvn-portal:local
    container_name: kvn-portal
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "0.35"
    mem_limit: 192m
    mem_reservation: 96m
    pids_limit: 64
    expose:
      - "8080"
    environment:
      - KVN_USERS_FILE=/project/runtime/users.json
    volumes:
      - ./portal-runtime:/project/runtime:ro
      - ./portal-data:/data
      - /run/kvn-portal:/run/kvn-portal:ro
      - /etc/kvn-portal/agent.secret:/run/secrets/agent-token:ro
      - /backup:/backup:ro
    group_add:
      - "${KVN_PORTAL_GID:-10001}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/internal/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  portal-gateway:
    profiles: ["portal-custom"]
    image: nginx:1.31.1-alpine
    container_name: kvn-portal-gateway
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: "0.15"
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 32
    depends_on:
      portal:
        condition: service_healthy
    ports:
      - "${KVN_PORTAL_PORT:-8444}:8443/tcp"
    volumes:
      - ./nginx/portal-gateway.conf:/etc/nginx/nginx.conf:ro
      - ./site-certs:/etc/nginx/certs:ro
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # Nginx master назначает UID 101 временным каталогам и затем снижает права worker.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run:rw,nosuid,nodev,size=4m
      - /var/cache/nginx:rw,nosuid,nodev,size=16m
    logging: *default-logging

  nginx:
    image: nginx:1.31.1-alpine
    container_name: nginx-front
    restart: unless-stopped
    stop_grace_period: 10s
    pids_limit: 64
    ports:
      # HTTP нужен для внешней проверки домена и редиректа на HTTPS.
      # Certbot standalone на время выпуска/renew временно останавливает этот сервис.
      - "80:80/tcp"
      - "443:443/tcp"
      # Эндпоинт подписки (HTTPS). При смене subscription.port в users.json — поправьте и здесь.
      - "2096:2096/tcp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./site-certs:/etc/nginx/certs:ro
      - ./nginx/web:/var/www/sub:ro
      - ./nginx/site:/var/www/site:ro
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # Master nginx подготавливает временные каталоги и снижает права worker до UID 101.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    tmpfs:
      - /var/run:rw,nosuid,nodev,size=4m
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
    networks:
      default:
        aliases:
          # В local-site режиме mtg резолвит свой FakeTLS SNI сюда через
          # Docker DNS и обращается к внутреннему HTTPS listener :8443.
          - "${KVN_MTG_CAMOUFLAGE_HOST:-mtg-decoy.invalid}"

  telemt:
    image: ghcr.io/telemt/telemt:3.4.24
    container_name: telemt-proxy
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 64
    expose:
      - "3129"
    ports:
      - "127.0.0.1:9091:9091/tcp"
      - "2446:3129/tcp"  # прямой резерв Telemt, мимо nginx
    working_dir: /tmp/telemt
    command: ["/app/config.toml"]
    environment:
      - RUST_LOG=silent
    logging: *default-logging
    volumes:
      - ./telemt/config.toml:/app/config.toml:ro
    tmpfs:
      - /tmp/telemt:rw,mode=1777,size=16m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144

  mtg:
    image: nineseconds/mtg:2.2.8
    container_name: mtg-proxy
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 64
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv4.ip_unprivileged_port_start=0
    expose:
      - "3128"
    ports:
      - "2447:3128/tcp"  # прямой резерв mtg FakeTLS, мимо nginx
    command: run /config.toml
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    volumes:
      - ./mtg/config.toml:/config.toml:ro

  hysteria:
    image: tobyxdd/hysteria:v2.10.0
    container_name: hysteria
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 64
    ports:
      - "443:443/udp"
    logging: *default-logging
    volumes:
      - ./hy2/config.yaml:/etc/hysteria/config.yaml:ro
      - ./hy2/certs:/etc/hysteria/certs:ro
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    command: ["server", "-c", "/etc/hysteria/config.yaml"]

  ocserv:
    build:
      context: ./ocserv
      # На некоторых VPS DNS внутри BuildKit не резолвит deb.debian.org,
      # хотя host apt работает. Для build-этапа ocserv используем host DNS.
      network: host
    image: kvn-ocserv:local
    container_name: ocserv
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: 256
    expose:
      - "443/tcp"
    ports:
      - "2448:443/tcp"   # прямой резерв OpenConnect TCP, мимо nginx
      - "4443:4443/udp"
    env_file:
      - ./ocserv/ocserv.env
    logging: *default-logging
    volumes:
      - ./ocserv/ocserv.conf:/etc/ocserv/ocserv.conf:ro
      - ./ocserv/users.txt:/etc/ocserv/users.txt:ro
      - ./ocserv/certs:/etc/ocserv/certs:ro
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN нужен только для TUN/NAT, остальные — для снижения прав worker ocserv.
      - NET_ADMIN
      - CHOWN
      - SETGID
      - SETUID
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.ip_unprivileged_port_start=0
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=16m

  xray:
    image: ghcr.io/xtls/xray-core:26.3.27
    container_name: xray
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 128
    expose:
      - "443/tcp"
      - "2053/tcp"
      - "2054/tcp"
    ports:
      - "2443:443/tcp"   # прямой резерв VLESS TLS, мимо nginx
      - "2444:2053/tcp"  # прямой резерв Reality xHTTP, мимо nginx
      - "2445:2054/tcp"  # прямой резерв Reality TCP, мимо nginx
    logging: *default-logging
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
      - ./certs:/etc/xray/certs:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    command: ["run", "-c", "/etc/xray/config.json"]
