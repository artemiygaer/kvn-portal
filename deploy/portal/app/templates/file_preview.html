{% extends "base.html" %}
{% block title %}{{ filename }} — KVN VPN{% endblock %}
{% block content %}<header class="page-header"><div><p class="eyebrow">Файл пользователя {{ name }}</p><h1>{{ filename }}</h1><p class="muted">Содержимое доступно только в текущей защищённой сессии.</p></div><a class="button secondary" href="{{ public_url('user_detail', name=name) }}">К пользователю</a></header><section class="panel file-preview">{% if image_url %}<img class="qr-preview" src="{{ image_url }}" alt="QR из файла {{ filename }}" width="320" height="320">{% else %}<div class="actions"><button type="button" class="secondary" data-copy-target="file-preview-content">Скопировать</button><a href="{{ public_url('user_download', name=name, filename=filename) }}">Скачать</a></div><pre id="file-preview-content" tabindex="0">{{ content }}</pre>{% endif %}</section>{% endblock %}
