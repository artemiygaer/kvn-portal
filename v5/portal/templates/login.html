{% extends "base.html" %}
{% block title %}Вход · KVN Portal{% endblock %}
{% block body %}
<section class="login panel">
  <h1>Вход в панель</h1>
  <p>Используйте учётную запись, созданную при установке.</p>
  {% if error %}<p role="alert" class="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Логин <input name="login" maxlength="64" autocomplete="username" required></label>
    <label>Пароль <input name="password" type="password" maxlength="256" autocomplete="current-password" required></label>
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}
