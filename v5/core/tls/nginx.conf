@STREAM@
user kvn-v5-gateway kvn-v5-web;
worker_processes 1;
pid /run/kvn-v5-gateway/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    limit_req_zone $binary_remote_addr zone=kvn_sub_ip:128k rate=15r/m;
    limit_req_zone $server_port zone=kvn_sub_global:128k rate=60r/m;
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    client_body_temp_path /run/kvn-v5-gateway/body;
    proxy_temp_path /run/kvn-v5-gateway/proxy;
    fastcgi_temp_path /run/kvn-v5-gateway/fastcgi;
    uwsgi_temp_path /run/kvn-v5-gateway/uwsgi;
    scgi_temp_path /run/kvn-v5-gateway/scgi;
    upstream portal { server unix:/run/kvn-v5-web/http.sock; }
@HTTP01@
    server {
        listen 127.0.0.1:8443 ssl reuseport;
        server_name localhost 127.0.0.1;
        ssl_certificate /etc/kvn-v5/gateway/bootstrap.crt;
        ssl_certificate_key /etc/kvn-v5/gateway/bootstrap.key;
        location = /__kvn_gateway_revision {
            if ($remote_addr != "127.0.0.1") { return 404; }
            default_type text/plain;
            return 200 "@REVISION@";
        }
@BOOTSTRAP_PROXY@
    }
@TLS@
}
