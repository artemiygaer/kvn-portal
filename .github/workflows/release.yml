name: Проверка перед выпуском v5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Проверка безопасных исходников и документации
        run: |
          /usr/bin/python3 -m compileall -q v5
      - name: Подписание и публикация
        run: |
          echo 'Этот workflow не публикует выпуск и не получает закрытый ключ.'
          echo 'Подписание и проверка артефактов выполняются издателем вне GitHub.'
