name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - name: Source safety
        run: python3 tools/source_safety.py --mode tracked
      - name: Документация и Python
        run: |
          python3 tools/docs_check.py
          python3 -m compileall -q portal tools
          python3 -m unittest discover -s tests -v
      - name: Bash и Compose
        run: |
          bash -n setup.sh update.sh tools/*.sh amneziawg/*.sh wireguard/*.sh ocserv/*.sh portal/*.sh
          docker compose -f docker-compose.yml config --quiet
      - name: Portal image tests
        run: docker build --target test -t kvn-portal:test portal
      - name: Безопасный deploy
        env:
          KVN_BUILD_ID: ci-${{ github.run_id }}
        run: |
          bash tools/build-deploy.sh
          python3 tools/deploy_archive.py kvn-vpn-deploy.tar.gz
          ! tar -tzf kvn-vpn-deploy.tar.gz | grep -E '(^|/)(\.supergoal|clients|certs|site-certs|portal\.db|metrics\.db|\.env)(/|$)'
      - uses: actions/upload-artifact@v4
        with:
          name: kvn-vpn-deploy-${{ github.sha }}
          path: kvn-vpn-deploy.tar.gz
          if-no-files-found: error
          retention-days: 7
