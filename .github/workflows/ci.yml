name: CI KVN Portal v5

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Зависимости тестов
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-flask python3-cryptography python3-websockets
      - name: Исходники и документация
        run: |
          /usr/bin/python3 tools/source_safety.py --mode tracked
          /usr/bin/python3 tools/architecture_check.py
          /usr/bin/python3 tools/docs_check.py
          /usr/bin/python3 -m compileall -q v5
      - name: Проверки v5 и совместимости
        run: |
          sudo env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" /usr/bin/python3 -m unittest discover -s tests/v5 -v
          sudo env GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" /usr/bin/python3 -m unittest discover -s tests -v
          cd portal
          sudo env PYTHONPATH=. /usr/bin/python3 -m unittest discover -s tests -v
